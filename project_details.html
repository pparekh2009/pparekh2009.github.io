<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./assets/css/bootstrap.min.css">
	<link rel="stylesheet" href="./assets/css/aos.css">
	<link rel="stylesheet" href="./assets/css/line-awesome.min.css">
	<link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

    <div class="container px-lg-5 pt-4">
        <a href="./all_projects.html" class="back-link"><i class="las la-arrow-left"></i> All Projects</a>
    </div>

    <div class="proj-hero">
        <img id="title-image" class="proj-hero-img" alt="">
        <div class="proj-hero-overlay">
            <h1 id="project-header"></h1>
        </div>
    </div>

    <div class="container px-lg-5 pb-5">

        <div class="desc-container mt-4">
            <h2>About</h2>
            <p id="project-description"></p>

            <div class="features-container">
                <h3>Features</h3>
                <div class="features-grid" id="feature-list"></div>
            </div>

            <div class="benefits-container">
                <h3>Benefits</h3>
                <ul id="benefit-list"></ul>
            </div>

            <div class="disclaimers-container">
                <h3>Disclaimers</h3>
                <ul id="disclaimer-list"></ul>
            </div>

            <div class="tech-stack-container">
                <h3>Tech Stack</h3>
                <div class="tech-grid" id="tech-stack-grid"></div>
            </div>

            <div id="link-container"></div>
        </div>

        <div class="proj-carousel-wrapper mt-5">
            <div id="project-carousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
                <div id="carousel-wrapper" class="carousel-inner"></div>

                <a class="carousel-control-prev" role="button" data-bs-target="#project-carousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </a>
                <a class="carousel-control-next" role="button" data-bs-target="#project-carousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </a>
            </div>
        </div>

    </div>

    <script src="./assets/js/bootstrap.bundle.min.js"></script>
	<script src="./assets/js/aos.js"></script>
	<script src="./assets/js/main.js"></script>
    <script type="module" src="./assets/js/proj_details.js"></script>
</body>
</html>
